<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Chanduka Lakshan - IT Undergraduate, Developer, Linux and DevOps enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2027"/>
      <stop offset="0.5" stop-color="#203a43"/>
      <stop offset="1" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#81f0c8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4fc3f7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fc3f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#81f0c8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#81f0c8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>

  <style>
    .name  { font: 700 58px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .role  { font: 500 22px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #cfe9f5; }
    .mono  { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #4fc3f7; }
    .tags  { font: 500 15px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8fb4c4; letter-spacing: 1px; }
    .brace { font: 700 190px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; fill-opacity: 0.05; }
    .rise  { animation: rise 1s ease-out both; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .55s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes rise  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .rise, .cursor { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <circle cx="150" cy="40" r="220" fill="url(#glowA)"/>
    <circle cx="1080" cy="240" r="260" fill="url(#glowB)"/>
    <text class="brace" x="40" y="215">{</text>
    <text class="brace" x="1085" y="215">}</text>

    <text class="mono rise" x="600" y="70" text-anchor="middle">~/hclperera $ whoami<tspan class="cursor">_</tspan></text>
    <text class="name rise d1" x="600" y="140" text-anchor="middle">Chanduka Lakshan</text>
    <rect class="rise d2" x="540" y="156" width="120" height="4" rx="2" fill="url(#accent)"/>
    <text class="role rise d2" x="600" y="196" text-anchor="middle">IT Undergraduate  •  Developer  •  Linux &amp; DevOps Enthusiast</text>
    <text class="tags rise d3" x="600" y="232" text-anchor="middle">C · C++ · Java · Python · JavaScript · PHP</text>
  </g>
</svg>
