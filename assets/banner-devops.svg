<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="DevOps pipeline banner: Chanduka Lakshan, code to build to run to deploy with Git, Docker, Linux and Kubernetes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132340"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .name { font: 800 50px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; }
    .role { font: 500 21px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #9fb3c8; }
    .git  { font-size: 14px; fill: #6b7f99; }
    .st   { font-size: 14px; fill: #7ee787; }
    .lab  { font-size: 17px; font-weight: 700; }
    .sub  { font-size: 13px; fill: #8b9bb0; }
    .node { fill: #0f1a2f; stroke-width: 2; stroke-opacity: .5; animation: glow 4s ease-in-out infinite; }
    .n2 { animation-delay: 1s; } .n3 { animation-delay: 2s; } .n4 { animation-delay: 3s; }
    @keyframes glow { 0%, 100% { stroke-opacity: .45; } 10%, 25% { stroke-opacity: 1; } }
    .flow { stroke: #4b6080; stroke-width: 2; stroke-dasharray: 6 6; animation: flow .8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -12; } }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .node, .flow, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#grid)"/>

    <text class="mono git" x="70" y="54">hclperera / main</text>
    <text class="name" x="70" y="108">Chanduka Lakshan</text>
    <text class="role" x="70" y="142">IT Undergraduate  •  Developer  •  Linux &amp; DevOps enthusiast</text>

    <rect x="930" y="34" width="210" height="32" rx="16" fill="#0f2a1f" stroke="#238636"/>
    <circle class="pulse" cx="953" cy="50" r="5" fill="#3fb950"/>
    <text class="mono st" x="970" y="55">pipeline passing</text>

    <!-- connectors -->
    <line class="flow" x1="276" y1="204" x2="336" y2="204"/><polygon points="336,198 348,204 336,210" fill="#4b6080"/>
    <line class="flow" x1="566" y1="204" x2="626" y2="204"/><polygon points="626,198 638,204 626,210" fill="#4b6080"/>
    <line class="flow" x1="856" y1="204" x2="916" y2="204"/><polygon points="916,198 928,204 916,210" fill="#4b6080"/>

    <!-- stages -->
    <rect class="node" x="60"  y="176" width="210" height="56" rx="12" stroke="#4fc3f7"/>
    <circle cx="88" cy="204" r="8" fill="none" stroke="#4fc3f7" stroke-width="2.5"/>
    <text class="mono lab" x="106" y="199" fill="#4fc3f7">code</text>
    <text class="mono sub" x="106" y="218">Git</text>

    <rect class="node n2" x="350" y="176" width="210" height="56" rx="12" stroke="#81f0c8"/>
    <circle cx="378" cy="204" r="8" fill="none" stroke="#81f0c8" stroke-width="2.5"/>
    <text class="mono lab" x="396" y="199" fill="#81f0c8">build</text>
    <text class="mono sub" x="396" y="218">Docker</text>

    <rect class="node n3" x="640" y="176" width="210" height="56" rx="12" stroke="#ffd166"/>
    <circle cx="668" cy="204" r="8" fill="none" stroke="#ffd166" stroke-width="2.5"/>
    <text class="mono lab" x="686" y="199" fill="#ffd166">run</text>
    <text class="mono sub" x="686" y="218">Linux</text>

    <rect class="node n4" x="930" y="176" width="210" height="56" rx="12" stroke="#ff7eb6"/>
    <circle cx="958" cy="204" r="8" fill="none" stroke="#ff7eb6" stroke-width="2.5"/>
    <text class="mono lab" x="976" y="199" fill="#ff7eb6">deploy</text>
    <text class="mono sub" x="976" y="218">Kubernetes</text>
  </g>
</svg>
