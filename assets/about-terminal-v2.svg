<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="About me, terminal style: Chanduka Lakshan, IT undergraduate, Linux and DevOps enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>
  <style>
    .m     { font: 500 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .title { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .p { fill: #7ee787; }   /* prompt $ */
    .c { fill: #e6edf3; }   /* plain text */
    .cm { fill: #8b949e; }  /* comment */
    .k { fill: #ff7b72; }   /* keyword / command */
    .o { fill: #79c0ff; }   /* string / path */
    .n { fill: #d2a8ff; }   /* value */
    .y { fill: #ffa657; }   /* flag */

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="38" fill="#2d2d2d"/>
    <line x1="0" y1="38" x2="1200" y2="38" stroke="#1a1a1a"/>

    <!-- terminal glyph -->
    <rect x="22" y="12" width="16" height="14" rx="2" fill="none" stroke="#9a9a9a" stroke-width="1.4"/>
    <path d="M25.5 16 L29 19 L25.5 22" fill="none" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="30.5" y1="22" x2="34" y2="22" stroke="#9a9a9a" stroke-width="1.4" stroke-linecap="round"/>

    <text class="title" x="48" y="24" text-anchor="start">chanduka@hclperera: ~/about-me</text>

    <!-- window controls: minimize, maximize, close -->
    <line x1="1097" y1="19" x2="1107" y2="19" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
    <rect x="1128" y="12" width="12" height="12" fill="none" stroke="#9a9a9a" stroke-width="1.6"/>
    <g>
      <line x1="1161" y1="12" x2="1173" y2="24" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="1173" y1="12" x2="1161" y2="24" stroke="#9a9a9a" stroke-width="1.6" stroke-linecap="round"/>
    </g>

    <text class="m"  x="36" y="76"><tspan class="p">$</tspan> <tspan class="k">whoami</tspan></text>
    <text class="m"  x="36" y="102"><tspan class="c">Chanduka Lakshan — IT Undergraduate @ RUSL</tspan></text>

    <text class="m"  x="36" y="140"><tspan class="p">$</tspan> <tspan class="k">cat</tspan> <tspan class="o">interests.txt</tspan></text>
    <text class="m"  x="56" y="166"><tspan class="cm">#</tspan> <tspan class="c">Linux Systems &amp; DevOps</tspan></text>
    <text class="m"  x="56" y="192"><tspan class="cm">#</tspan> <tspan class="c">Mobile App Development</tspan></text>
    <text class="m"  x="56" y="218"><tspan class="cm">#</tspan> <tspan class="c">Problem Solving</tspan></text>
    <text class="m"  x="56" y="244"><tspan class="cm">#</tspan> <tspan class="c">Open Source Contribution</tspan></text>

    <text class="m"  x="36" y="282"><tspan class="p">$</tspan> <tspan class="k">status</tspan> <tspan class="y">--current</tspan></text>
    <text class="m"  x="36" y="308"><tspan class="o">learning</tspan><tspan class="c">=</tspan><tspan class="n">"Linux Fundamentals"</tspan>  <tspan class="o">open_to</tspan><tspan class="c">=</tspan><tspan class="n">"collaboration"</tspan></text>

    <text class="m" x="36" y="332"><tspan class="p">$</tspan> <tspan class="c">teamwork + communication == success</tspan> <tspan class="cursor c">_</tspan></text>
  </g>
</svg>
