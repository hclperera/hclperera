<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Terminal style banner: Chanduka Lakshan, IT Undergraduate, Developer, Linux and DevOps enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>
  <style>
    .m     { font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .s     { font: 500 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .title { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .p { fill: #7ee787; } .c { fill: #e6edf3; } .o { fill: #79c0ff; } .k { fill: #ff7b72; }
    .big { font-size: 34px; font-weight: 700; fill: #ffffff; }
    .line { animation: show .01s both; }
    .l1 { animation-delay: .3s; } .l2 { animation-delay: .9s; } .l3 { animation-delay: 1.5s; }
    .l4 { animation-delay: 2.1s; } .l5 { animation-delay: 2.7s; }
    @keyframes show  { from { opacity: 0; } to { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line, .cursor { animation: none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="#0d1117"/>
    <rect width="1200" height="40" fill="#161b22"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#30363d"/>
    <circle cx="26" cy="20" r="6.5" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6.5" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6.5" fill="#27c93f"/>
    <text class="title" x="600" y="25" text-anchor="middle">chanduka@hclperera: ~</text>

    <text class="m line l1" x="40" y="86"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text class="m line l2" x="40" y="128"><tspan class="big">Chanduka Lakshan</tspan></text>
    <text class="m line l3" x="40" y="170"><tspan class="p">$</tspan> <tspan class="c">cat about.txt</tspan></text>
    <text class="m line l4" x="40" y="202"><tspan class="o">IT Undergraduate | Developer | Linux &amp; DevOps Enthusiast</tspan></text>
    <text class="m line l5" x="40" y="240"><tspan class="p">$</tspan> <tspan class="cursor c">_</tspan></text>

    <g class="s line l4">
      <text class="k" x="820" y="86">role</text>   <text class="c" x="905" y="86">Developer</text>
      <text class="k" x="820" y="114">uni</text>    <text class="c" x="905" y="114">RUSL</text>
      <text class="k" x="820" y="142">focus</text>  <text class="c" x="905" y="142">Linux &amp; DevOps</text>
      <text class="k" x="820" y="170">status</text> <text class="c" x="905" y="170">open to collaborate</text>
    </g>
  </g>
</svg>
