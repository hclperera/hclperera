<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80" role="img" aria-label="Minimal footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0969da" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .t   { font: 500 18px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #57606a; }
    .n   { font: 700 18px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #1f2328; }
    .dot { fill: #0969da; }
    @media (prefers-color-scheme: dark) {
      .t { fill: #8b949e; } .n { fill: #e6edf3; } .dot { fill: #58a6ff; }
    }
  </style>
  <rect x="100" y="39" width="350" height="2" rx="1" fill="url(#l)"/>
  <rect x="750" y="39" width="350" height="2" rx="1" fill="url(#r)"/>
  <circle class="dot" cx="470" cy="40" r="4"/>
  <circle class="dot" cx="730" cy="40" r="4"/>
  <text class="t" x="600" y="46" text-anchor="middle">Thanks for stopping by</text>
</svg>
