<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="50" viewBox="0 0 1200 50" role="img" aria-label="DevOps status bar footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="round"><rect width="1200" height="50" rx="10"/></clipPath></defs>
  <style>
    .m { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="50" fill="#0b1220"/>
    <rect width="1200" height="1" fill="#1f2a44"/>
    <rect width="200" height="50" fill="#1f6feb"/>
    <circle cx="24" cy="25" r="5" fill="#ffffff"/>
    <text class="m" x="40" y="30" fill="#ffffff" font-weight="700">hclperera / main</text>
    <circle class="pulse" cx="228" cy="25" r="5" fill="#3fb950"/>
    <text class="m" x="244" y="30" fill="#7ee787">pipeline passing</text>
    <text class="m" x="430" y="30" fill="#9fb3c8">open to collaboration</text>
    <text class="m" x="1170" y="30" text-anchor="end" fill="#9fb3c8">thanks for visiting</text>
  </g>
</svg>
