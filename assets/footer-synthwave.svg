<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" preserveAspectRatio="none" role="img" aria-label="Synthwave footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a4d"/>
      <stop offset="1" stop-color="#12061f"/>
    </linearGradient>
    <filter id="neon" x="-10%" y="-60%" width="120%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blur"/>
      <feFlood flood-color="#ff2e97" flood-opacity="0.9" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="100" rx="14"/></clipPath>
  </defs>
  <style>
    .t { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #ffd6f0; letter-spacing: 4px; }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="100" fill="url(#bg)"/>
    <g stroke="#ff2e97" stroke-opacity="0.55" stroke-width="1.2">
      <line x1="600" y1="-70" x2="-800" y2="100"/><line x1="600" y1="-70" x2="-600" y2="100"/>
      <line x1="600" y1="-70" x2="-400" y2="100"/><line x1="600" y1="-70" x2="-200" y2="100"/>
      <line x1="600" y1="-70" x2="0" y2="100"/><line x1="600" y1="-70" x2="200" y2="100"/>
      <line x1="600" y1="-70" x2="400" y2="100"/><line x1="600" y1="-70" x2="600" y2="100"/>
      <line x1="600" y1="-70" x2="800" y2="100"/><line x1="600" y1="-70" x2="1000" y2="100"/>
      <line x1="600" y1="-70" x2="1200" y2="100"/><line x1="600" y1="-70" x2="1400" y2="100"/>
      <line x1="600" y1="-70" x2="1600" y2="100"/><line x1="600" y1="-70" x2="1800" y2="100"/>
      <line x1="600" y1="-70" x2="2000" y2="100"/>
      <line x1="0" y1="10" x2="1200" y2="10"/><line x1="0" y1="24" x2="1200" y2="24"/>
      <line x1="0" y1="44" x2="1200" y2="44"/><line x1="0" y1="70" x2="1200" y2="70"/>
      <line x1="0" y1="98" x2="1200" y2="98"/>
    </g>
    <rect width="1200" height="2" fill="#00e5ff" opacity="0.9"/>
    <rect x="410" y="32" width="380" height="38" rx="19" fill="#12061f" fill-opacity="0.85" stroke="#ff2e97" stroke-opacity="0.6"/>
    <text class="t" x="600" y="57" text-anchor="middle" filter="url(#neon)">THANKS FOR VISITING</text>
  </g>
</svg>
