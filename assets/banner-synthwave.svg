<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Synthwave banner: Chanduka Lakshan, IT Undergraduate, Developer, Linux and DevOps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0220"/>
      <stop offset="0.7" stop-color="#2a0a4d"/>
      <stop offset="1" stop-color="#5b1467"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66d"/>
      <stop offset="0.5" stop-color="#ff9a5a"/>
      <stop offset="1" stop-color="#ff2e97"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0a4d"/>
      <stop offset="1" stop-color="#12061f"/>
    </linearGradient>
    <mask id="sunmask">
      <rect width="1200" height="260" fill="#fff"/>
      <rect x="880" y="128" width="210" height="3" fill="#000"/>
      <rect x="880" y="144" width="210" height="5" fill="#000"/>
      <rect x="880" y="161" width="210" height="7" fill="#000"/>
      <rect x="880" y="179" width="210" height="9" fill="#000"/>
    </mask>
    <filter id="neon" x="-10%" y="-40%" width="120%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feFlood flood-color="#ff2e97" flood-opacity="0.9" result="c"/>
      <feComposite in="c" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect width="1200" height="260" rx="18"/></clipPath>
    <clipPath id="floorclip"><rect x="0" y="195" width="1200" height="65"/></clipPath>
  </defs>
  <style>
    .name { font: 800 58px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; letter-spacing: 1px; }
    .role { font: 500 21px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; fill: #ffd6f0; }
    .mono { font: 500 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #00e5ff; letter-spacing: 2px; }
    .tw { animation: tw 3s ease-in-out infinite; }
    .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.4s; } .d3 { animation-delay: 2.1s; }
    @keyframes tw { 0%, 100% { opacity: .9; } 50% { opacity: .15; } }
    @media (prefers-reduced-motion: reduce) { .tw { animation: none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="260" fill="url(#sky)"/>

    <g fill="#ffffff" opacity="0.75">
      <circle class="tw" cx="120" cy="30" r="1.4"/>
      <circle class="tw d1" cx="260" cy="58" r="1.2"/>
      <circle cx="430" cy="24" r="1.2"/>
      <circle class="tw d2" cx="560" cy="62" r="1.4"/>
      <circle cx="700" cy="34" r="1.2"/>
      <circle class="tw d3" cx="820" cy="22" r="1.4"/>
      <circle cx="1120" cy="42" r="1.2"/>
      <circle class="tw d1" cx="1160" cy="96" r="1.2"/>
      <circle cx="40" cy="112" r="1.2"/>
      <circle class="tw d2" cx="640" cy="110" r="1.2"/>
    </g>

    <circle cx="985" cy="120" r="86" fill="url(#sun)" mask="url(#sunmask)"/>

    <rect y="195" width="1200" height="65" fill="url(#floor)"/>
    <g clip-path="url(#floorclip)" stroke="#ff2e97" stroke-opacity="0.6" stroke-width="1.2">
      <line x1="600" y1="150" x2="-840" y2="260"/><line x1="600" y1="150" x2="-680" y2="260"/>
      <line x1="600" y1="150" x2="-520" y2="260"/><line x1="600" y1="150" x2="-360" y2="260"/>
      <line x1="600" y1="150" x2="-200" y2="260"/><line x1="600" y1="150" x2="-40" y2="260"/>
      <line x1="600" y1="150" x2="120" y2="260"/><line x1="600" y1="150" x2="280" y2="260"/>
      <line x1="600" y1="150" x2="440" y2="260"/><line x1="600" y1="150" x2="600" y2="260"/>
      <line x1="600" y1="150" x2="760" y2="260"/><line x1="600" y1="150" x2="920" y2="260"/>
      <line x1="600" y1="150" x2="1080" y2="260"/><line x1="600" y1="150" x2="1240" y2="260"/>
      <line x1="600" y1="150" x2="1400" y2="260"/><line x1="600" y1="150" x2="1560" y2="260"/>
      <line x1="600" y1="150" x2="1720" y2="260"/><line x1="600" y1="150" x2="1880" y2="260"/>
      <line x1="600" y1="150" x2="2040" y2="260"/>
      <line x1="0" y1="201" x2="1200" y2="201"/><line x1="0" y1="209" x2="1200" y2="209"/>
      <line x1="0" y1="220" x2="1200" y2="220"/><line x1="0" y1="235" x2="1200" y2="235"/>
      <line x1="0" y1="255" x2="1200" y2="255"/>
    </g>
    <rect y="194" width="1200" height="2" fill="#00e5ff" opacity="0.9"/>

    <text class="mono" x="70" y="72">// hclperera :: online</text>
    <text class="name" x="70" y="132" filter="url(#neon)">Chanduka Lakshan</text>
    <text class="role" x="70" y="168">IT Undergraduate  •  Developer  •  Linux &amp; DevOps</text>
  </g>
</svg>
