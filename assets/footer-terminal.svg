<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="70" viewBox="0 0 1200 70" role="img" aria-label="Terminal style footer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><clipPath id="round"><rect width="1200" height="70" rx="12"/></clipPath></defs>
  <style>
    .m { font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <g clip-path="url(#round)">
    <rect width="1200" height="70" fill="#0d1117"/>
    <rect width="1200" height="2" fill="#30363d"/>
    <text class="m" x="40" y="42"><tspan fill="#7ee787">$</tspan> <tspan fill="#e6edf3">git commit -m "thanks for visiting" &amp;&amp; exit</tspan><tspan class="cursor" fill="#e6edf3"> _</tspan></text>
    <text class="m" x="1160" y="42" text-anchor="end" fill="#7ee787">exit 0</text>
  </g>
</svg>
