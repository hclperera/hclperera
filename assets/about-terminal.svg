<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="About me, terminal style: Chanduka Lakshan, IT undergraduate, Linux and DevOps enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="round"><rect width="1200" height="340" rx="14"/></clipPath>
  </defs>
  <style>
    .m     { font: 500 19px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .title { font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
    .p { fill: #7ee787; }   /* prompt $ */
    .c { fill: #e6edf3; }   /* plain text */
    .cm { fill: #8b949e; }  /* comment */
    .k { fill: #ff7b72; }   /* keyword / command */
    .o { fill: #79c0ff; }   /* string / path */
    .n { fill: #d2a8ff; }   /* value */
    .y { fill: #ffa657; }   /* flag */

    .line { opacity: 0; animation: show .01s forwards; }
    .l1  { animation-delay: .2s; }
    .l2  { animation-delay: .8s; }
    .l3  { animation-delay: 1.3s; }
    .l4  { animation-delay: 1.9s; }
    .l5  { animation-delay: 2.4s; }
    .l6  { animation-delay: 2.9s; }
    .l7  { animation-delay: 3.4s; }
    .l8  { animation-delay: 3.9s; }
    .l9  { animation-delay: 4.4s; }
    .l10 { animation-delay: 4.9s; }
    .l11 { animation-delay: 5.4s; }
    @keyframes show { to { opacity: 1; } }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line { opacity: 1; animation: none; } .cursor { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="#0d1117"/>
    <rect width="1200" height="40" fill="#161b22"/>
    <line x1="0" y1="40" x2="1200" y2="40" stroke="#30363d"/>
    <circle cx="26" cy="20" r="6.5" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6.5" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6.5" fill="#27c93f"/>
    <text class="title" x="600" y="25" text-anchor="middle">chanduka@hclperera: ~/about-me</text>

    <text class="m line l1"  x="36" y="76"><tspan class="p">$</tspan> <tspan class="k">whoami</tspan></text>
    <text class="m line l2"  x="36" y="102"><tspan class="c">Chanduka Lakshan — IT Undergraduate @ RUSL</tspan></text>

    <text class="m line l3"  x="36" y="140"><tspan class="p">$</tspan> <tspan class="k">cat</tspan> <tspan class="o">interests.txt</tspan></text>
    <text class="m line l4"  x="56" y="166"><tspan class="cm">#</tspan> <tspan class="c">Linux Systems &amp; DevOps</tspan></text>
    <text class="m line l5"  x="56" y="192"><tspan class="cm">#</tspan> <tspan class="c">Mobile App Development</tspan></text>
    <text class="m line l6"  x="56" y="218"><tspan class="cm">#</tspan> <tspan class="c">Problem Solving</tspan></text>
    <text class="m line l7"  x="56" y="244"><tspan class="cm">#</tspan> <tspan class="c">Open Source Contribution</tspan></text>

    <text class="m line l8"  x="36" y="282"><tspan class="p">$</tspan> <tspan class="k">status</tspan> <tspan class="y">--current</tspan></text>
    <text class="m line l9"  x="36" y="308"><tspan class="o">learning</tspan><tspan class="c">=</tspan><tspan class="n">"Linux Fundamentals"</tspan>  <tspan class="o">open_to</tspan><tspan class="c">=</tspan><tspan class="n">"collaboration"</tspan></text>

    <text class="m line l10" x="36" y="332"><tspan class="p">$</tspan> <tspan class="c">teamwork + communication == success</tspan> <tspan class="cursor c">_</tspan></text>
  </g>
</svg>
