<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Minimal banner: Chanduka Lakshan, IT Undergraduate, Developer, Linux and DevOps" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54aeff"/>
      <stop offset="1" stop-color="#7ee787"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle class="dotp" cx="2" cy="2" r="1.3"/>
    </pattern>
  </defs>
  <style>
    .bg   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 2; }
    .fg   { fill: #1f2328; }
    .mut  { fill: #57606a; }
    .acc  { fill: #0969da; }
    .ring { fill: none; stroke: #0969da; stroke-opacity: .25; stroke-width: 2; stroke-dasharray: 4 9; }
    .pill { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
    .dotp { fill: #1f2328; fill-opacity: .14; }
    .name { font: 800 54px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .role { font: 500 22px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .hi   { font: 700 14px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; letter-spacing: 4px; }
    .ptx  { font: 600 15px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .code { font: 700 42px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .spin { transform-box: fill-box; transform-origin: center; animation: spin 60s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; stroke: #30363d; }
      .fg   { fill: #e6edf3; }
      .mut  { fill: #8b949e; }
      .acc  { fill: #58a6ff; }
      .ring { stroke: #58a6ff; }
      .pill { fill: #161b22; stroke: #30363d; }
      .dotp { fill: #e6edf3; fill-opacity: .14; }
    }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  </style>

  <rect class="bg" x="1" y="1" width="1198" height="258" rx="18"/>
  <rect x="760" y="20" width="400" height="220" fill="url(#dots)"/>

  <text class="hi acc" x="70" y="72">HELLO, I'M</text>
  <text class="name fg" x="70" y="128">Chanduka Lakshan</text>
  <text class="role mut" x="70" y="164">IT Undergraduate  ·  Developer  ·  Linux &amp; DevOps enthusiast</text>

  <g>
    <rect class="pill" x="70"  y="186" width="72" height="34" rx="17"/><text class="ptx fg" x="106" y="208" text-anchor="middle">Linux</text>
    <rect class="pill" x="154" y="186" width="84" height="34" rx="17"/><text class="ptx fg" x="196" y="208" text-anchor="middle">DevOps</text>
    <rect class="pill" x="250" y="186" width="84" height="34" rx="17"/><text class="ptx fg" x="292" y="208" text-anchor="middle">Python</text>
    <rect class="pill" x="346" y="186" width="58" height="34" rx="17"/><text class="ptx fg" x="375" y="208" text-anchor="middle">C++</text>
    <rect class="pill" x="416" y="186" width="64" height="34" rx="17"/><text class="ptx fg" x="448" y="208" text-anchor="middle">Java</text>
    <rect class="pill" x="492" y="186" width="84" height="34" rx="17"/><text class="ptx fg" x="534" y="208" text-anchor="middle">Docker</text>
  </g>

  <circle class="ring spin" cx="990" cy="130" r="104"/>
  <circle cx="990" cy="130" r="76" fill="url(#orb)"/>
  <text class="code" x="990" y="145" text-anchor="middle">&lt;/&gt;</text>
  <circle cx="900" cy="58" r="7" fill="#f78166"/>
  <circle cx="1092" cy="70" r="5" fill="#d2a8ff"/>
  <circle cx="1078" cy="206" r="6" fill="#ffd33d"/>
  <circle class="acc" cx="905" cy="208" r="4"/>
</svg>
